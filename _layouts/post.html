---
layout: default
---
<article class="post-article">
  <p class="post-date">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.categories.size > 0 %} · {{ page.categories | join: ", " }}{% endif %}
  </p>

  <h1>{{ page.title }}</h1>

  <div class="post-body">
    {{ content }}
  </div>

  <a class="post-back" href="{{ '/blog/' | relative_url }}">← All posts</a>
</article>
