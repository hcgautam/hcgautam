<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <h2>{{ site.title }}</h2>
      <p>{{ site.description }}</p>
    </div>
    <div>
      <h3>Contact</h3>
      <p><a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></p>
      <p>{{ site.author.location }}</p>
    </div>
    <div>
      <h3>Links</h3>
      <ul class="footer-links">
        <li><a href="{{ '/files/cv.pdf' | relative_url }}">Download CV</a></li>
        <li><a href="{{ site.author.github }}">GitHub</a></li>
        <li><a href="{{ site.author.linkedin }}">LinkedIn</a></li>
        <li><a href="{{ site.author.scholar }}">Google Scholar</a></li>
      </ul>
    </div>
  </div>
  <div class="container footer-bottom">
    <p>© <span id="current-year"></span> {{ site.title }}. Built with Jekyll and GitHub Pages.</p>
  </div>
</footer>
