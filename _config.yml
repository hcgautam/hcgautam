# ---------------------------------------------------------------------------
# BUILD
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:title/
timezone: Asia/Kolkata

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# GitHub Pages supported plugins only
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Posts get the post layout automatically — no need to repeat it in front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# ---------------------------------------------------------------------------
# NAVIGATION
# ---------------------------------------------------------------------------
nav:
  - title: "About"
    url: "/about/"
  - title: "Research"
    url: "/research/"
  - title: "Projects"
    url: "/projects/"
  - title: "Publications"
    url: "/publications/"
  - title: "Talks & Service"
    url: "/teaching/"
  - title: "CV"
    url: "/cv/"
  - title: "Blog"
    url: "/blog/"
  - title: "Contact"
    url: "/contact/"

exclude:
  - README.md
  - REVIEW.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .jekyll-cache
