# ---------------------------------------------------------------------------
# SITE
# Set `url` and `baseurl` BEFORE you deploy. If these are wrong, the RSS feed,
# sitemap, SEO tags and social-share cards all point at the wrong address.
#   User site  (repo named  hcgautam.github.io):  baseurl: ""      url: "https://hcgautam.github.io"
#   Project site (repo named academic-website):   baseurl: "/academic-website"
# ---------------------------------------------------------------------------
title: "Hrishikesh Chandra Gautam"
tagline: "Air Quality · Data · Policy"
description: >-
  Air quality researcher working across satellite PM2.5, population exposure and
  life expectancy, emission inventories, machine learning and policy analytics.
url: "https://hcgautam.github.io"
baseurl: "/hcgautam"
lang: en_US

# ---------------------------------------------------------------------------
# AUTHOR
# Every link below is optional. Leave a value empty ("") and the site simply
# will not render that link — no broken placeholder URLs go live.
# ---------------------------------------------------------------------------
author:
  name: "Dr. Hrishikesh Chandra Gautam"
  short_name: "H. C. Gautam"
  initials: "HCG"
  role: "Data Specialist — Air Quality Life Index"
  affiliation: "Energy Policy Institute at the University of Chicago (EPIC)"
  location: "New Delhi, India"
  email: "hcgautam.nitk@gmail.com"
  photo: "/assets/img/profile.jpg"
  cv: "/files/cv.pdf"

social:
  github: "https://github.com/hcgautam"
  linkedin: "https://www.linkedin.com/in/dr-hrishikesh-chandra-gautam-b3091316/"
  scholar: "https://scholar.google.com/citations?hl=en&user=m36e-LUAAAAJ"  
  orcid: ""         # e.g. "https://orcid.org/0000-0000-0000-0000"
  researchgate: "https://www.researchgate.net/profile/Hrishikesh-Gautam?ev=hdr_xprf"
  X: "https://x.com/coolkaku"       # handle only, e.g. "hcgautam"

# ---------------------------------------------------------------------------
# BUILD
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:title/
timezone: Asia/Kolkata

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# GitHub Pages supported plugins only
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Posts get the post layout automatically — no need to repeat it in front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# ---------------------------------------------------------------------------
# NAVIGATION
# ---------------------------------------------------------------------------
nav:
  - title: "About"
    url: "/about/"
  - title: "Research"
    url: "/research/"
  - title: "Projects"
    url: "/projects/"
  - title: "Publications"
    url: "/publications/"
  - title: "Talks & Service"
    url: "/teaching/"
  - title: "CV"
    url: "/cv/"
  - title: "Blog"
    url: "/blog/"
  - title: "Contact"
    url: "/contact/"

exclude:
  - README.md
  - REVIEW.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .jekyll-cache
