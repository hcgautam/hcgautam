baseurl: "/hcgautam" # For a project repo, use "/repository-name". For username.github.io, keep empty.

# Author information
author:
  name: "Dr. Hrishikesh Chandra Gautam"
  role: "Data Specialist, Air Quality Life Index"
  affiliation: "Energy Policy Institute at the University of Chicago"
  location: "India"
  email: "hcgautam.nitk@gmail.com"
  github: "https://github.com/hcgautam" # TODO: replace with real GitHub URL
  linkedin: "https://www.linkedin.com/in/dr-hrishikesh-chandra-gautam-b3091316/" # TODO: replace with real LinkedIn URL
